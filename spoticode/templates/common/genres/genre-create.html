{% extends "base.html" %}

{% block title %}Add Genre | SpotiCode{% endblock %}

{% block main_content %}

<div class="container-fluid pt-4 px-4">
    <div class="row vh-auto min-vh-100 bg-secondary rounded align-items-top justify-content-center mx-0">

        <div class="col-sm-12 col-xl-6">
            <div class="bg-secondary rounded h-100 p-4">
                <h3 class="text-center text-light mb-4">Add Genre</h3>

                <div class="form-floating mb-3">
                    <form action="{% url 'genre_create' %}" method="post">
                        {% csrf_token %}
                        {{ form }}

                        <input class="btn btn-primary py-3 w-100 mb-4" type="submit" value="Add" />
                    </form>

                    <a href="{% url 'genres_all'%}" type="button" class="btn btn-outline-light py-3 w-100 mb-3">Back</a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
