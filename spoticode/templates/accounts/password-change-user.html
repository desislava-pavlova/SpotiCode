{% extends "base.html" %}

{% block title %}Change Password | SpotiCode{% endblock %}

{% block main_content %}

<div class="container-fluid">
    <div class="row h-100 align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-20">
            <div class="bg-secondary rounded p-4 p-sm-5 my-4 mx-3">
                <h3 class="mb-4 text-center">Change Password</h3>

                <div class="form-floating mb-3">
                    <form action="{% url 'user_password_change' id=user.id %}" method="post">
                        {% csrf_token %}
                        {{ form }}

                        <input class="btn btn-primary py-3 w-100 mb-4" type="submit" value="Save"/>
                    </form>

                    <a href="{% url 'user_details' id=user.id %}" type="button" class="btn btn-outline-light py-3 w-100 mb-3">Back</a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
