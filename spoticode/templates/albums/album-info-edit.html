{% extends "base.html" %}

{% block title %}Edit Info | {{ album }} | SpotiCode{% endblock %}

{% block main_content %}

<div class="container-fluid pt-4 px-4">
    <div class="row vh-auto min-vh-100 bg-secondary rounded align-items-top justify-content-center mx-0">

        <div class="col-sm-12 col-xl-6">
            <div class="bg-secondary rounded h-auto p-4">
                <h4 class="text-center text-light m-4 mb-3">Edit Album Info</h4>

                <div class="form-floating mb-3">
                    <form method="post" action="{% url 'album_info_edit' id=album.id %}">
                        {% csrf_token %}
                        {{ form }}

                        <button type="submit" class="btn btn-primary py-3 w-100 mb-3">Save</button>
                    </form>

                    <a href="{% url 'album_details' id=album.id %}" type="button" class="btn btn-outline-light py-3 w-100 mb-3">Back</a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
