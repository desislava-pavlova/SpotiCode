{% extends "base.html" %}

{% block title %}Edit Info | {{ song }} | SpotiCode{% endblock %}

{% block main_content %}

<div class="container-fluid pt-4 px-4">
    <div class="row vh-auto min-vh-100 bg-secondary rounded align-items-top justify-content-center mx-0">

        <div class="col-sm-12 col-xl-6">
            <div class="bg-secondary rounded h-100 p-4">
                <h3 class="text-center text-light mb-4">Edit Song Info</h3>

                <div class="form-floating mb-3">
                    <form action="{% url 'song_info_edit' id=song.id %}" method="post">
                        {% csrf_token %}
                        {{ form }}

                        <button type="submit" class="btn btn-primary py-3 w-100 mb-3">Save</button>
                    </form>

                    <a href="{% url 'song_details' id=song.id %}" type="button" class="btn btn-outline-light py-3 w-100 mb-3">Back</a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
