{% extends "base.html" %}

{% block title %}Delete Task Comment | SpotiCode{% endblock %}

{% block main_content %}

<div class="container-fluid pt-4 px-4">
  <div class="row vh-auto min-vh-100 bg-secondary rounded align-items-center justify-content-center mx-0">

    <div class="col-sm-12 col-xl-6">
      <div class="bg-secondary rounded h-100 p-4">
        <h3 class="text-center text-light m-4 mb-4">Delete Comment</h3>

        <h4 class="text-center text-white-50 mb-4">Are you sure you want to delete this comment from {{ task }}?</h4>
        <h4 class="text-center text-white-50 mb-4"><u>{{ task_comment.comment_text }}<u></h4>

        <form method="post" action="{% url 'task_comment_delete' id=task.id c_id=task_comment.id %}">

          <input class="btn btn-primary py-3 w-100 mb-3" type="submit" value="Delete">
            {% csrf_token %}
        </form>

          <a href="{% url 'task_details' id=task.id %}" type="button" class="btn btn-outline-light py-3 w-100 mb-3">Back</a>
      </div>
    </div>

  </div>
</div>

{% endblock %}
